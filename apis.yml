name: Runway Financial
description: >-
  Runway is a financial planning and analysis (FP&A) platform for high-growth
  teams, offering collaborative planning, budgeting, revenue and headcount
  forecasting, scenario modeling, and variance analysis over 750+ connected data
  sources (accounting, HRIS, CRM, revenue, and data warehouses). Beyond the
  application, Runway exposes a limited bearer-authenticated Export API for
  programmatic CSV export of model and database pages, and a hosted, OAuth-based
  read-only MCP server so Claude and other AI tools can search and read a Runway
  workspace. Runway migrated its primary domain from runway.com to cfo.ai and is
  a 500 Global portfolio company.
